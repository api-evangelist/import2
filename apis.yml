aid: import2
name: Import2
description: >-
  Import2 is a fully automated data-migration platform that moves customer data
  between SaaS applications — CRM, helpdesk, and project-management tools — without
  CSV exports or custom development. Users connect a source and destination app and
  Import2 moves records, custom fields, pipelines, and deal stages directly over each
  app's API, processing data in real time on a temporary machine that is destroyed
  after the migration. It supports 50+ tools (Salesforce, HubSpot, Zendesk, Pipedrive,
  Asana, Monday.com, Jira and more) and offers a free sample migration before a full
  run. Import2 also exposes a partner/vendor API (v2.1) so SaaS vendors can create and
  track automated migrations programmatically, plus sibling tools ViaCSV and MyCRMBackup.
